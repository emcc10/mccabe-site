name: Deploy Windsor hero video

on:
  push:
    branches:
      - main
    # Only when Windsor video assets change — NOT template.min.js (PLP deploys use deploy.yml).
    paths:
      - "vspfiles/windsor-home.mp4"
      - "vspfiles/windsor.mp4"
      - "scripts/upload_windsor_home_video.py"
      - ".github/workflows/deploy-windsor-video.yml"
  workflow_dispatch:

concurrency:
  group: deploy-windsor-video
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip3 install paramiko

      - name: Upload Windsor hero MP4 files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: |
          if [[ ! -f vspfiles/windsor-home.mp4 && ! -f vspfiles/windsor.mp4 ]]; then
            echo "::notice::No Windsor MP4 in repo — skip (use workflow_dispatch after adding vspfiles/windsor-home.mp4)"
            exit 0
          fi
          python3 scripts/upload_windsor_home_video.py

      - name: Verify live Windsor MP4 sizes
        if: hashFiles('vspfiles/windsor-home.mp4', 'vspfiles/windsor.mp4') != ''
        run: |
          for rel in vspfiles/windsor-home.mp4 vspfiles/windsor.mp4; do
            [[ -f "$rel" ]] || continue
            name=$(basename "$rel")
            want=$(wc -c < "$rel" | tr -d ' ')
            live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/${name}?v=$(date +%s)" | wc -c | tr -d ' ')
            echo "${name}: local=${want} live=${live}"
            test "$live" = "$want"
          done
