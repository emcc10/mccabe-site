name: Deploy Windsor hero video

on:
  push:
    branches:
      - main
    paths:
      - "vspfiles/windsor-home.mp4"
      - "vspfiles/windsor.mp4"
      - "scripts/upload_windsor_home_video.py"
      - "vspfiles/js/mc-pdp-auth-cta-fix.js"
      - "vspfiles/js/mc-windsor-hero-fix.js"
      - "vspfiles/templates/266/js/min/template.min.js"
      - "template_266.html"
      - ".github/workflows/deploy-windsor-video.yml"
  workflow_dispatch:

concurrency:
  group: deploy-windsor-video
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip3 install paramiko

      - name: Upload Windsor hero MP4 files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: python3 scripts/upload_windsor_home_video.py

      - name: Verify live Windsor MP4 sizes
        run: |
          want=$(wc -c < vspfiles/windsor-home.mp4 | tr -d ' ')
          for name in windsor-home.mp4 windsor.mp4; do
            live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/${name}?v=$(date +%s)" | wc -c | tr -d ' ')
            echo "${name}: local=${want} live=${live}"
            test "$live" = "$want"
          done
