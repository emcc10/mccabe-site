name: Deploy missing Saranoni variant photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.sar-missing-variant-photos-upload.txt"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-sar-missing-variant-photos.yml"

concurrency:
  group: deploy-sar-missing-variant-photos
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko + Pillow
        run: pip3 install paramiko Pillow

      - name: Force-upload missing Saranoni option S/T photos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.sar-missing-variant-photos-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Verify Batman Minky Lush size variants on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          must = [
              "SAR-BATMAN-MNKY-LUSH-1202-T.jpg",
              "SAR-BATMAN-MNKY-LUSH-1202-S.jpg",
              "SAR-BATMAN-MNKY-LUSH-1205-T.jpg",
              "SAR-SUPERMAN-MNKY-LUSH-1203-T.jpg",
              "SAR-WONDER-WOMAN-MNKY-LUSH-1202-T.jpg",
          ]
          fail = []
          photos = Path("vspfiles/photos")
          for name in must:
              local = photos / name
              if not local.is_file():
                  fail.append(f"missing local {name}")
                  continue
              local_md5 = hashlib.md5(local.read_bytes()).hexdigest()
              ok = False
              last = None
              for attempt in range(1, 13):
                  url = f"https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/{name}?v={time.time_ns()}"
                  try:
                      raw = urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}),
                          timeout=30,
                      ).read()
                      im = Image.open(io.BytesIO(raw))
                      match = hashlib.md5(raw).hexdigest() == local_md5
                      print(f"{name} attempt={attempt} size={im.size} match={match}")
                      if match:
                          ok = True
                          break
                      last = im.size
                  except Exception as e:
                      last = str(e)
                      print(f"{name} attempt={attempt} err={e}")
                  time.sleep(5)
              if not ok:
                  fail.append(f"{name} last={last}")
          if fail:
              raise SystemExit("CDN verify failed:\n" + "\n".join(fail))
          print("Verified key Saranoni variant photos on CDN4")
          PY
