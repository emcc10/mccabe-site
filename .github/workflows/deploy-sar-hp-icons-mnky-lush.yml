name: Restore HP Icons Minky Lush photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.sar-hp-icons-mnky-lush-upload.txt"
      - "vspfiles/photos/SAR-HP-HP-ICONS-MNKY-LUSH*.jpg"
      - "vspfiles/imports/saranoni/**"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-sar-hp-icons-mnky-lush.yml"

concurrency:
  group: deploy-sar-hp-icons-mnky-lush
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko
        run: pip3 install paramiko Pillow

      - name: Force-upload HP Icons Minky Lush photos
        if: hashFiles('vspfiles/photos/.sar-hp-icons-mnky-lush-upload.txt') != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.sar-hp-icons-mnky-lush-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Upload Saranoni optionids import CSVs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: |
          set -e
          python3 <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from deploy_volusion_assets import _upload_one
          from verify_template_sftp import connect_paramiko_transport
          import paramiko

          files = sorted(Path("vspfiles/imports/saranoni").glob("*.csv"))
          if not files:
              raise SystemExit("no saranoni import csvs")
          transport = connect_paramiko_transport(
              os.environ["FTP_SERVER"],
              int(os.environ.get("SFTP_PORT", "2222")),
              os.environ["FTP_USERNAME"],
              os.environ["FTP_PASSWORD"],
          )
          sftp = paramiko.SFTPClient.from_transport(transport)
          fail = 0
          try:
              for local in files:
                  ok = _upload_one(sftp, str(local))
                  print(("OK" if ok else "FAIL"), local)
                  if not ok:
                      fail += 1
          finally:
              sftp.close()
              transport.close()
          raise SystemExit(fail)
          PY

      - name: Verify HP Icons variant photos on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          photos = Path("vspfiles/photos")
          names = [l.strip() for l in (photos / ".sar-hp-icons-mnky-lush-upload.txt").read_text().splitlines() if l.strip()]
          # prioritize option variants + hero
          must = [n for n in names if any(x in n for x in ["-1.jpg", "-1202-", "-1203-", "-1204-", "-1205-"])]
          fail = []
          for name in must:
              local = photos / name
              local_bytes = local.read_bytes()
              local_md5 = hashlib.md5(local_bytes).hexdigest()
              with Image.open(io.BytesIO(local_bytes)) as im:
                  if im.size[0] < 650 and not name.endswith("-S.jpg"):
                      # swatches may be 320; heroes/T must be >=650
                      if name.endswith("-T.jpg") or name.endswith("-1.jpg") or name.endswith("-1T.jpg"):
                          fail.append(f"local {name} width {im.size[0]} < 650")
                          continue
              ok = False
              last = None
              for attempt in range(1, 13):
                  url = f"https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/{name}?v={time.time_ns()}"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      raw = urllib.request.urlopen(req, timeout=30).read()
                      if hashlib.md5(raw).hexdigest() == local_md5:
                          print(f"OK {name}")
                          ok = True
                          break
                      last = (len(raw), hashlib.md5(raw).hexdigest())
                  except Exception as e:
                      last = str(e)
                  time.sleep(5)
              if not ok:
                  fail.append(f"{name} last={last}")
          if fail:
              raise SystemExit("CDN verify failed:\n" + "\n".join(fail))
          print(f"Verified {len(must)} HP Icons photos on CDN4")
          PY
