name: Redeploy Adeline Patio numbered alt photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.adeline-patio-altviews-upload.txt"
      - "vspfiles/photos/Adeline-Patio-Set-*.jpg"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-adeline-patio-altviews.yml"

concurrency:
  group: deploy-adeline-patio-altviews
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko + Pillow
        run: pip3 install paramiko Pillow

      - name: Force-upload Adeline Patio Set photos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.adeline-patio-altviews-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Verify numbered alt slots 3-8 on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          photos = Path("vspfiles/photos")
          must = [f"Adeline-Patio-Set-{n}.jpg" for n in (1, 2, 3, 4, 5, 6, 7, 8)]
          must += [f"Adeline-Patio-Set-{n}T.jpg" for n in (1, 2, 3, 4, 5, 6, 7, 8)]
          fail = []
          for name in must:
              local = photos / name
              local_bytes = local.read_bytes()
              local_md5 = hashlib.md5(local_bytes).hexdigest()
              with Image.open(io.BytesIO(local_bytes)) as im:
                  if im.size[0] < 650:
                      fail.append(f"local {name} {im.size[0]}px")
                      continue
              ok = False
              for attempt in range(1, 13):
                  url = (
                      "https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/"
                      f"{name}?mcimg=20260728adeline1&v={time.time_ns()}"
                  )
                  try:
                      raw = urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}),
                          timeout=45,
                      ).read()
                      im = Image.open(io.BytesIO(raw))
                      match = hashlib.md5(raw).hexdigest() == local_md5
                      print(f"{name} attempt={attempt} live={im.size[0]}x{im.size[1]} match={match}")
                      if match and im.size[0] >= 650:
                          ok = True
                          break
                  except Exception as e:
                      print(f"{name} attempt={attempt} err={e}")
                  time.sleep(5)
              if not ok:
                  fail.append(name)
          if fail:
              raise SystemExit("CDN verify failed: " + ", ".join(fail))
          print("OK: Adeline Patio numbered alts are on CDN")
          PY
