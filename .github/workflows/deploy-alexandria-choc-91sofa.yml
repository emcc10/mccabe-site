name: Redeploy Alexandria Chocolate sofa photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.ss-alexandria-choc-91sofa-upload.txt"
      - "vspfiles/photos/SS-ALEXANDRIA-CHOCOLATE-91SOFA-*.jpg"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-alexandria-choc-91sofa.yml"

concurrency:
  group: deploy-alexandria-choc-91sofa
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko + Pillow
        run: pip3 install paramiko Pillow

      - name: Force-upload Alexandria Chocolate 91SOFA photos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.ss-alexandria-choc-91sofa-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Verify sharp -1/-2T on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          photos = Path("vspfiles/photos")
          must = [
              "SS-ALEXANDRIA-CHOCOLATE-91SOFA-1.jpg",
              "SS-ALEXANDRIA-CHOCOLATE-91SOFA-1T.jpg",
              "SS-ALEXANDRIA-CHOCOLATE-91SOFA-2.jpg",
              "SS-ALEXANDRIA-CHOCOLATE-91SOFA-2T.jpg",
          ]
          fail = []
          for name in must:
              local = photos / name
              local_bytes = local.read_bytes()
              local_md5 = hashlib.md5(local_bytes).hexdigest()
              with Image.open(io.BytesIO(local_bytes)) as im:
                  if im.size[0] < 650:
                      fail.append(f"local {name} {im.size[0]}px")
                      continue
              ok = False
              for attempt in range(1, 13):
                  url = (
                      "https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/"
                      f"{name}?mcimg=20260728alexchoc1&v={time.time_ns()}"
                  )
                  try:
                      raw = urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}),
                          timeout=30,
                      ).read()
                      im = Image.open(io.BytesIO(raw))
                      match = hashlib.md5(raw).hexdigest() == local_md5
                      print(f"{name} attempt={attempt} live={im.size[0]}x{im.size[1]} match={match}")
                      if match and im.size[0] >= 650:
                          ok = True
                          break
                  except Exception as e:
                      print(f"{name} attempt={attempt} err={e}")
                  time.sleep(5)
              if not ok:
                  fail.append(name)
          if fail:
              raise SystemExit("CDN verify failed: " + ", ".join(fail))
          print("OK: Alexandria Chocolate 91SOFA heroes are sharp on CDN")
          PY
