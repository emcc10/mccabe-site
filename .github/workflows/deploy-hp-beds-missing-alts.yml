name: Deploy Highland Park beds + missing alts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.ss-hp-beds-missing-alts-upload.txt"
      - "vspfiles/photos/SS-HP900*FB*.jpg"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-hp-beds-missing-alts.yml"

concurrency:
  group: deploy-hp-beds-missing-alts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko + Pillow
        run: pip3 install paramiko Pillow

      - name: Force-upload Highland Park beds + missing alt/variant photos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.ss-hp-beds-missing-alts-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Verify Highland Park bed galleries on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          photos = Path("vspfiles/photos")
          must = [
              "SS-HP900QFBD-1.jpg",
              "SS-HP900QFBD-altview1.jpg",
              "SS-HP900QFBD-altview2.jpg",
              "SS-HP900QFBD-altview3.jpg",
              "SS-HP900QFBD-altview4.jpg",
              "SS-HP900QFBD-altview5.jpg",
              "SS-HP900KFBD-altview1.jpg",
              "SS-HP900KFBD-altview3.jpg",
              "SS-HP900QFBW-altview1.jpg",
              "SS-HP900QFBW-altview2.jpg",
              "SS-HP900QFBW-altview3.jpg",
              "SS-HP900KFBW-altview1.jpg",
              "SS-HP900KFBW-altview2.jpg",
              "SS-HP900KFBW-altview3.jpg",
          ]
          fail = []
          for name in must:
              local = photos / name
              if not local.is_file():
                  fail.append(f"missing local {name}")
                  continue
              local_bytes = local.read_bytes()
              local_md5 = hashlib.md5(local_bytes).hexdigest()
              with Image.open(io.BytesIO(local_bytes)) as im:
                  if im.size[0] < 650:
                      fail.append(f"local {name} still {im.size[0]}px")
                      continue
              ok = False
              last = None
              for attempt in range(1, 13):
                  url = f"https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/{name}?v={time.time_ns()}"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      raw = urllib.request.urlopen(req, timeout=30).read()
                      im = Image.open(io.BytesIO(raw))
                      print(f"{name} attempt={attempt} live={im.size[0]}x{im.size[1]} match={hashlib.md5(raw).hexdigest()==local_md5}")
                      if hashlib.md5(raw).hexdigest() == local_md5 and im.size[0] >= 650:
                          ok = True
                          break
                      last = (im.size, len(raw))
                  except Exception as e:
                      last = str(e)
                      print(f"{name} attempt={attempt} err={e}")
                  time.sleep(5)
              if not ok:
                  fail.append(f"{name} last={last}")
          if fail:
              raise SystemExit("CDN verify failed:\n" + "\n".join(fail))
          print("Verified Highland Park bed photos on CDN4")
          PY
