name: Deploy PLP photos to Volusion

on:
  push:
    branches:
      - main
    paths:
      - "vspfiles/photos/**"
      - "scripts/upload_missing_stock_photos.py"
      - "scripts/upload_recliner_plp_photos.py"
      - "scripts/fetch_recliner_plp_photos.py"
      - "scripts/upload_tmh_mat_photos.py"
      - "scripts/fetch_tmh_tile_photos.py"
      - "scripts/audit_tmh_photos.py"
      - "scripts/upload_steve_silver_bedroom_photos.py"
      - "scripts/fetch_steve_silver_dresser_photos.py"
      - "scripts/fetch_steve_silver_nightstand_photos.py"
      - "scripts/fetch_steve_silver_chest_photos.py"
      - "scripts/fetch_steve_silver_mirror_photos.py"
      - "scripts/upload_steve_silver_mirror_photos.py"
      - "scripts/fetch_steve_silver_upholstery_photos.py"
      - "scripts/generate_volusion_photo_thumbnails.py"
      - ".github/workflows/deploy-plp-photos.yml"
      - ".github/scripts/deploy-volusion.sh"
  workflow_dispatch:
    inputs:
      scope:
        description: Upload scope (ss-bedroom-only skips TMH/recliner bulk steps)
        required: true
        default: ss-bedroom-only
        type: choice
        options:
          - ss-bedroom-only
          - full

# Never cancel mid-photo-upload — large batches can run 40+ minutes.
concurrency:
  group: deploy-volusion-photos
  cancel-in-progress: false

jobs:
  upload-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp and Paramiko
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssh-client python3-pip
          pip3 install paramiko

      - name: Detect changed photos (push only)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          changed_files=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'vspfiles/photos/' || true)"
          fi
          {
            echo "DEPLOY_CHANGED_ONLY=1"
            echo "DEPLOY_CHANGED_FILES<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_ENV"
          if grep -qE 'vspfiles/photos/(TMH-MAT-|TMH-TRV-|TMH-TILE-|TMH-RACK-|\.tmh-mat-fullsize)' <<< "$changed_files"; then
            echo "UPLOAD_TMH_MATS=1" >> "$GITHUB_ENV"
          fi

      - name: Sync TMH-TRV travel mat photo aliases
        if: env.UPLOAD_TMH_MATS == '1' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        run: python3 scripts/sync_tmh_trv_mat_photos.py

      - name: Upload Steve Silver bedroom photos (explicit sync — first)
        if: |
          (github.event_name == 'push' && contains(env.DEPLOY_CHANGED_FILES, 'vspfiles/photos/SS-')) ||
          (github.event_name == 'workflow_dispatch' && inputs.scope == 'ss-bedroom-only')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: python3 scripts/upload_steve_silver_bedroom_photos.py

      - name: Upload changed vspfiles/photos (SFTP)
        if: github.event_name == 'push'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PHOTOS_ONLY_DEPLOY: "1"
          SKIP_TEMPLATE_DEPLOY: "1"
          DEPLOY_STRICT: "1"
        run: bash .github/scripts/deploy-volusion.sh

      - name: Upload Steve Silver bedroom photos (manual full deploy retry)
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: python3 scripts/upload_steve_silver_bedroom_photos.py

      - name: Verify Steve Silver bedroom photos on live CDN
        if: github.event_name == 'push' && contains(env.DEPLOY_CHANGED_FILES, 'vspfiles/photos/SS-') || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          for f in SS-SIG900DR-1.jpg SS-BC900DR-1.jpg SS-BC900CTT-1.jpg SS-BC900MR-1.jpg SS-CAS900M-1.jpg; do
            local=$(wc -c < "vspfiles/photos/$f" | tr -d ' ')
            live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}?v=$(date +%s)" | wc -c | tr -d ' ')
            echo "$f local=$local live=$live"
            if [ "$live" -lt "$((local / 2))" ]; then
              echo "::error::Bedroom photo not synced to CDN: $f (local=$local live=$live)"
              exit 1
            fi
          done

      - name: Upload all TMH mat and travel photos (full-size sync)
        if: env.UPLOAD_TMH_MATS == '1' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: python3 scripts/upload_tmh_mat_photos.py

      - name: Upload missing stock photos (manual / full refresh)
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: |
          python3 scripts/upload_recliner_plp_photos.py
          python3 scripts/upload_missing_stock_photos.py

      - name: Verify TMH mat photos on live CDN
        if: env.UPLOAD_TMH_MATS == '1' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        run: |
          set -e
          for f in TMH-MAT-PINK-MAT-1.jpg TMH-MAT-PINK-MAT-2T.jpg TMH-TRV-AMETHYST-GEM-MAT-1.jpg; do
            local=$(wc -c < "vspfiles/photos/$f" | tr -d ' ')
            live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}?v=$(date +%s)" | wc -c | tr -d ' ')
            echo "$f local=$local live=$live"
            if [ "$live" -lt "$((local / 2))" ]; then
              echo "::error::Mat photo not synced to CDN: $f (local=$local live=$live)"
              exit 1
            fi
          done

      - name: Verify sample photos on live CDN
        run: |
          set -e
          for f in 77743-01-1.jpg 77651-01-1.jpg 42306-31-1.jpg; do
            url="https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}"
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "$f -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Photo not reachable: $url"
              exit 1
            fi
          done
