name: Redeploy closeout numbered alt photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/.closeout-numbered-alts-upload.txt"
      - "scripts/upload_photo_list.py"
      - ".github/workflows/deploy-closeout-numbered-alts.yml"

concurrency:
  group: deploy-closeout-numbered-alts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko + Pillow
        run: pip3 install paramiko Pillow

      - name: Force-upload closeout numbered alt slots
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          UPLOAD_LIST_FILE: "vspfiles/photos/.closeout-numbered-alts-upload.txt"
        run: python3 scripts/upload_photo_list.py

      - name: Spot-verify sample products on CDN
        run: |
          set -e
          python3 <<'PY'
          import hashlib, io, time, urllib.request
          from pathlib import Path
          from PIL import Image

          photos = Path("vspfiles/photos")
          samples = [
              "Tamara-Outdoor-Sectional-3.jpg",
              "Burlington-Dining-Set-5.jpg",
              "Canova-Dining-Set-4.jpg",
              "Delilah-Patio-Chairs-7.jpg",
              "KL-HUM-MILITARY-6.jpg",
              "Wyatt-Chofa-8.jpg",
              "Tyler-Bar-Set-8.jpg",
              "39F-W1820P505527-3.jpg",
          ]
          fail = []
          for name in samples:
              local = photos / name
              if not local.exists():
                  fail.append(f"missing local {name}")
                  continue
              local_md5 = hashlib.md5(local.read_bytes()).hexdigest()
              ok = False
              for attempt in range(1, 13):
                  url = (
                      "https://cdn4.volusion.store/srulk-fqudj/v/vspfiles/photos/"
                      f"{name}?mcimg=20260728closeout1&v={time.time_ns()}"
                  )
                  try:
                      raw = urllib.request.urlopen(
                          urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}),
                          timeout=45,
                      ).read()
                      im = Image.open(io.BytesIO(raw))
                      match = hashlib.md5(raw).hexdigest() == local_md5
                      print(f"{name} attempt={attempt} {im.size[0]}x{im.size[1]} match={match}")
                      if match and im.size[0] >= 650:
                          ok = True
                          break
                  except Exception as e:
                      print(f"{name} attempt={attempt} err={e}")
                  time.sleep(5)
              if not ok:
                  fail.append(name)
          if fail:
              raise SystemExit("CDN verify failed: " + ", ".join(fail))
          print("OK: sample closeout numbered alts verified on CDN")
          PY
