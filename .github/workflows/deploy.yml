# SFTP deploy: uses secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (port 2222)
# Template at /template_266.html. Assets under /vspfiles/.
name: Deploy Volusion Theme

on:
  push:
    branches:
      - main
      - debug/saranoni-pdp-runtime
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "::error::FTP_SERVER secret is not set in GitHub. Add it in repo Settings → Secrets and variables → Actions."; exit 1; fi
          if [ -z "$FTP_USERNAME" ]; then echo "::error::FTP_USERNAME secret is not set."; exit 1; fi
          if [ -z "$FTP_PASSWORD" ]; then echo "::error::FTP_PASSWORD secret is not set."; exit 1; fi
          echo "Secrets are set. Deploying to $FTP_SERVER (port 2222)."

      - name: Show what we're deploying
        run: |
          echo "Template (to remote root /):"
          ls -la template_266.html 2>/dev/null || true
          echo "Contents of vspfiles/ (to /vspfiles/):"
          find vspfiles -type f | head -40
          ls -la vspfiles/css/custom-safe.css 2>/dev/null || true

      - name: Show exact remote paths (for FileZilla comparison)
        run: |
          echo "Remote paths are relative to your SFTP root /."
          echo "Template will be uploaded to:  /v/template_266.html"
          echo "vspfiles will be uploaded to:  /v/vspfiles/"
          echo "So custom-safe.css lands at:   /v/vspfiles/css/custom-safe.css"
          echo ""
          echo "In FileZilla: after login, open /v/vspfiles/css/custom-safe.css and check that Modified time is NOW after this run."

      - name: Deploy via SFTP
        uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: "2222"
          uploads: |
            template_266.html => v/
            vspfiles/ => v/vspfiles/

      - name: Deploy summary
        run: |
          echo "If the job succeeded, the files were written to the paths above."
          echo "Check FileZilla at: /v/vspfiles/css/custom-safe.css"
          echo "Live JS verify marker: MC_PDP_AUTH_DEPLOY_VERIFY_20260623sarrepair2"
          curl -fsS "https://www.mccabestheaterandliving.com/v/vspfiles/js/mc-pdp-auth-cta-fix.js?mcrd=$(date +%s)" | grep -q 'table-cell' \
            && echo "Live mc-pdp-auth-cta-fix.js contains Saranoni table-cell fix." \
            || echo "::warning::Live JS still missing table-cell fix — check SFTP root vs /v/ path."
