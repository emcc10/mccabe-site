name: Deploy Steve Silver dining photos

# Game/dining/server import pack → /v/vspfiles/photos/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/imports/steve-silver-volusion/**"
      - "vspfiles/photos/SS-RL*.jpg"
      - "vspfiles/photos/SS-ABR*.jpg"
      - "vspfiles/photos/SS-COL*.jpg"
      - "vspfiles/photos/SS-MM*.jpg"
      - "vspfiles/photos/SS-NP*.jpg"
      - "vspfiles/photos/SS-GA*.jpg"
      - "vspfiles/photos/SS-TU*.jpg"
      - "vspfiles/photos/SS-RED*.jpg"
      - "vspfiles/photos/SS-JS*.jpg"
      - "vspfiles/photos/SS-CBR*.jpg"
      - "vspfiles/photos/SS-BUR*.jpg"
      - "vspfiles/photos/SS-VCM*.jpg"
      - "vspfiles/photos/.ss-dining-missing-altviews.txt"
      - "scripts/upload_steve_silver_dining_photos.py"
      - ".github/workflows/deploy-ss-dining-photos.yml"

concurrency:
  group: deploy-ss-dining-photos-v4
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko
        run: pip3 install paramiko

      - name: Force-upload missing altviews (both SFTP paths)
        if: hashFiles('vspfiles/photos/.ss-dining-missing-altviews.txt') != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          FORCE_REUPLOAD: "1"
          UPLOAD_LIST_FILE: "vspfiles/photos/.ss-dining-missing-altviews.txt"
          SS_DINING_UPLOAD_WORKERS: "8"
        run: python3 scripts/upload_steve_silver_dining_photos.py

      - name: Upload any remaining dining/game/server photos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          FORCE_REUPLOAD: "0"
          SS_DINING_UPLOAD_WORKERS: "6"
        run: python3 scripts/upload_steve_silver_dining_photos.py

      - name: Verify heroes, 2T, and sample altviews on live CDN
        run: |
          set -e
          for f in \
            SS-ABR500KSV-1.jpg SS-ABR500KSV-2T.jpg SS-ABR500KSV-altview1.jpg \
            SS-RL500K-GT-D6PC-1.jpg SS-RL500K-GT-D6PC-2T.jpg SS-RL500K-GT-D6PC-altview1.jpg \
            SS-VCM420WTN-C5PC-1.jpg SS-VCM420WTN-C5PC-2T.jpg SS-VCM420WTN-C5PC-altview1.jpg \
            SS-NP500SV-1.jpg SS-NP500SV-2T.jpg SS-NP500SV-altview1.jpg \
            SS-RED500KSV-1.jpg SS-RED500KSV-2T.jpg SS-RED500TSV-altview2.jpg; do
            if [ ! -f "vspfiles/photos/$f" ]; then
              echo "skip $f (not in repo)"
              continue
            fi
            local=$(wc -c < "vspfiles/photos/$f" | tr -d ' ')
            live=0
            for attempt in 1 2 3 4 5 6 7 8; do
              live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}?v=$(date +%s%N)" | wc -c | tr -d ' ' || echo 0)
              echo "$f attempt=$attempt local=$local live=$live"
              if [ "$live" -ge $((local / 2)) ]; then
                break
              fi
              sleep 4
            done
            if [ "$live" -lt "$((local / 2))" ]; then
              echo "::error::Photo not synced to CDN: $f (local=$local live=$live)"
              exit 1
            fi
          done
