name: Deploy Steve Silver dining photos

# Game/dining/server import pack → /v/vspfiles/photos/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/imports/steve-silver-volusion/**"
      - "vspfiles/photos/SS-RL*.jpg"
      - "vspfiles/photos/SS-ABR*.jpg"
      - "vspfiles/photos/SS-COL*.jpg"
      - "vspfiles/photos/SS-MM*.jpg"
      - "vspfiles/photos/SS-NP*.jpg"
      - "vspfiles/photos/SS-GA*.jpg"
      - "vspfiles/photos/SS-TU*.jpg"
      - "vspfiles/photos/SS-RED*.jpg"
      - "vspfiles/photos/SS-JS*.jpg"
      - "vspfiles/photos/SS-CBR*.jpg"
      - "vspfiles/photos/SS-BUR*.jpg"
      - "vspfiles/photos/SS-VCM*.jpg"
      - "vspfiles/photos/.ss-dining-missing-altviews.txt"
      - "vspfiles/photos/.ss-colvin-garland-fix.txt"
      - "vspfiles/photos/.ss-ga500tsv-upload.txt"
      - "scripts/upload_steve_silver_dining_photos.py"
      - ".github/workflows/deploy-ss-dining-photos.yml"

concurrency:
  group: deploy-ss-dining-photos-v6
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko
        run: pip3 install paramiko

      - name: Force-upload Garland greige sideboard SS-GA500TSV
        if: hashFiles('vspfiles/photos/.ss-ga500tsv-upload.txt') != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          FORCE_REUPLOAD: "1"
          UPLOAD_LIST_FILE: "vspfiles/photos/.ss-ga500tsv-upload.txt"
          SS_DINING_UPLOAD_WORKERS: "4"
        run: python3 scripts/upload_steve_silver_dining_photos.py

      - name: Force-upload Colvin/Garland corrected product photos
        if: hashFiles('vspfiles/photos/.ss-colvin-garland-fix.txt') != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
          FORCE_REUPLOAD: "1"
          CLEAN_REMOTE_EXTRAS: "1"
          UPLOAD_LIST_FILE: "vspfiles/photos/.ss-colvin-garland-fix.txt"
          SS_DINING_UPLOAD_WORKERS: "6"
        run: python3 scripts/upload_steve_silver_dining_photos.py

      - name: Verify GA500TSV + key Garland heroes
        run: |
          set -e
          for f in \
            SS-GA500TSV-1.jpg SS-GA500TSV-2T.jpg SS-GA500TSV-altview1.jpg \
            SS-GA500SV-1.jpg SS-GA500C-1.jpg; do
            if [ ! -f "vspfiles/photos/$f" ]; then
              echo "skip $f (not in repo)"
              continue
            fi
            local=$(wc -c < "vspfiles/photos/$f" | tr -d ' ')
            live=0
            for attempt in 1 2 3 4 5 6 7 8; do
              live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}?v=$(date +%s%N)" | wc -c | tr -d ' ' || echo 0)
              echo "$f attempt=$attempt local=$local live=$live"
              if [ "$live" -ge $((local / 2)) ]; then
                break
              fi
              sleep 4
            done
            if [ "$live" -lt "$((local / 2))" ]; then
              echo "::error::Photo not synced to CDN: $f (local=$local live=$live)"
              exit 1
            fi
          done
