name: Deploy Steve Silver photos (fast)

# Bypasses the slow deploy-plp-photos queue. Use when bedroom/upholstery photos
# are correct in git but the live CDN still shows old lifestyle thumbnails.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vspfiles/photos/SS-*.jpg"
      - "scripts/upload_steve_silver_bedroom_photos.py"
      - ".github/workflows/deploy-ss-bedroom-photos.yml"

concurrency:
  group: deploy-ss-bedroom-photos
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Game/dining/server import packs can be 1000+ files.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Paramiko
        run: pip3 install paramiko

      - name: Upload all SS photos (Paramiko SFTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: "2222"
        run: python3 scripts/upload_steve_silver_bedroom_photos.py

      - name: Verify key photos on live CDN
        run: |
          set -e
          for f in \
            SS-BC900DR-1.jpg SS-SIG900DR-1.jpg \
            SS-BC900MR-1.jpg SS-BC950MRB-1.jpg SS-CAS900M-1.jpg SS-RV900M-1.jpg \
            SS-BC900KFB-1.jpg SS-BC900QFB-1.jpg SS-CAS900KFB-1.jpg SS-RV900KFB-1.jpg \
            SS-CONROE-PWR-CHAISE-SECT-1.jpg SS-GATLIN-PWR-SECT-1.jpg SS-DANIEL-PWR-SOFA-1.jpg \
            SS-KEILY-BROWN-86SOFA-1.jpg SS-DENVER-BROWN-PWR-SECT-1.jpg SS-NOAH-GRAY-SLEEPER-SOFA-1.jpg \
            SS-BC900MR-1T.jpg SS-CAS900M-1T.jpg SS-CONROE-PWR-CHAISE-SECT-1T.jpg \
            SS-ABR500KSV-1.jpg SS-RL500K-GT-D6PC-1.jpg SS-BUR500NSV-1.jpg SS-VCM420WTN-C5PC-1.jpg; do
            if [ ! -f "vspfiles/photos/$f" ]; then
              echo "skip $f (not in repo)"
              continue
            fi
            local=$(wc -c < "vspfiles/photos/$f" | tr -d ' ')
            live=$(curl -fsSL "https://www.mccabestheaterandliving.com/v/vspfiles/photos/${f}?v=$(date +%s)" | wc -c | tr -d ' ')
            echo "$f local=$local live=$live"
            if [ "$live" -lt "$((local / 2))" ]; then
              echo "::error::Photo not synced to CDN: $f (local=$local live=$live)"
              exit 1
            fi
          done
